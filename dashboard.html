<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIT — Dashboard</title>

    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
</head>

<body>

    <!-- Starfield -->
    <div id="stars"></div>

    <!-- NAVBAR -->
    <nav class="navbar glass-nav" id="mainNavbar">
        <div class="navbar-container">

            <div class="navbar-left">
                <label for="sidebarCheckbox" class="mobile-toggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </label>
                <a class="navbar-brand" href="index.html" id="brandLogo">
                    <div class="brand-icon">
                        <i class="fas fa-circle"></i>
                    </div>
                    <span>ORBIT</span>
                </a>
            </div>

            <!-- RIGHT: Search + Notifications + Theme -->
            <div class="navbar-right">
                <div class="search-box" id="searchBox">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Search..." autocomplete="off" />
                </div>
                <button class="nav-icon-btn" id="notificationsBtn" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="badge-dot" id="notificationBadge"></span>
                </button>

                <button class="nav-icon-btn" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

        </div>
    </nav>

</body>

</html>
