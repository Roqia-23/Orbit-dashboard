<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIT — Personal Productivity</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/theme.css">
</head>

<body>

    <!-- Starfield -->
    <div id="stars"></div>

    <!-- Theme Toggle Button -->
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="stage">
        <div class="eyebrow">
            <i class="fas fa-rocket me-2"></i> Productivity, Orbited
        </div>
        <h1 class="wordmark">ORBIT</h1>

        <!-- Orbit System -->
        <div class="orbit-system" aria-hidden="true">
            <div class="core"></div>
            <div class="ring ring--1">
                <div class="node"></div>
            </div>
            <div class="ring ring--2">
                <div class="node"></div>
            </div>
            <div class="ring ring--3">
                <div class="node"></div>
            </div>
        </div>

        <p class="tagline">
            <i class="fas fa-tasks me-2 text-primary"></i>
            Your tasks, notes, and habits — all pulled into one calm center.
        </p>

        <a href="dashboard.html" class="cta">
            <i class="fas fa-arrow-right me-2"></i> Enter Dashboard
        </a>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
