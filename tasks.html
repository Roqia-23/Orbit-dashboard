<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIT — Tasks</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/tasks.css" />
</head>

<body>
    <!-- Starfield -->
    <div id="stars"></div>
    
    
    <!-- NAVBAR (same as dashboard) -->
    
    <nav class="navbar glass-nav" id="mainNavbar">
        <div class="navbar-container">
    
            <div class="navbar-left">
                <label for="sidebarCheckbox" class="mobile-toggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </label>
                <a class="navbar-brand" href="index.html" id="brandLogo">
                    <div class="brand-icon">
                        <i class="fas fa-circle"></i>
                    </div>
                    <span>ORBIT</span>
                </a>
            </div>
    
            <div class="navbar-right">
                <div class="search-box" id="searchBox">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Search tasks..." autocomplete="off" />
                </div>
    
                <button class="nav-icon-btn" id="notificationsBtn" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="badge-dot" id="notificationBadge"></span>
                </button>
    
                <button class="nav-icon-btn" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
    
        </div>
    </nav>
<input type="checkbox" id="sidebarCheckbox" class="sidebar-checkbox" hidden />

<aside class="sidebar" id="sidebar">
    <div class="sidebar-profile" id="userProfile">
        <div class="profile-avatar" id="profileAvatar">
            <i class="fas fa-user"></i>
        </div>
        <div class="profile-info">
            <strong id="userName">Guest User</strong>
            <small id="userStatus">Welcome to ORBIT</small>
        </div>
    </div>

    <ul class="sidebar-menu" id="sidebarMenu">
        <li class="menu-label">MAIN</li>
        <li>
            <a href="dashboard.html" id="navDashboard">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a href="tasks.html" class="active" id="navTasks">
                <i class="fas fa-tasks"></i>
                <span>Tasks</span>
                <span class="menu-count" id="tasksCount">0</span>
            </a>
        </li>
        <li>
            <a href="notes.html" id="navNotes">
                <i class="fas fa-sticky-note"></i>
                <span>Notes</span>
                <span class="menu-count" id="notesCount">0</span>
            </a>
        </li>
        <li>
            <a href="habits.html" id="navHabits">
                <i class="fas fa-heart"></i>
                <span>Habits</span>
                <span class="menu-count" id="habitsCount">0</span>
            </a>
        </li>

        <li class="divider"></li>
        <li class="menu-label">OTHER</li>

        <li>
            <a href="#" id="navStats">
                <i class="fas fa-chart-line"></i>
                <span>Statistics</span>
            </a>
        </li>
        <li>
            <a href="#" id="navSettings">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </li>
        <li>
            <a href="#" id="navHelp">
                <i class="fas fa-question-circle"></i>
                <span>Help</span>
            </a>
        </li>
    </ul>

    <div class="focus-widget" id="focusWidget">
        <i class="fas fa-clock"></i>
        <div>
            <strong id="focusTime">0h Focus</strong>
            <small>Today's session</small>
        </div>
    </div>
</aside>


   
         <!-- SCRIPTS -->
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/tasks.js"></script>
</body>

</html>
